<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault graph</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
      --inbox: #db61a2; --projects: #f0883e; --areas: #a371f7; --resources: #58a6ff; --archive: #6e7681; --none: #c9d1d9;
      --attempted: #f85149; --tier1: #e3b341; --tier2: #3fb950; --edge: #3d444d;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328; --muted: #59636e;
        --archive: #8c959f; --none: #424a53; --edge: #c8d1da; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
      display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: auto 1fr; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; }
    .stat { color: var(--muted); }
    .stat b { color: var(--text); }
    aside { background: var(--panel); padding: 12px 16px; overflow: auto; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
    aside h2:first-child { margin-top: 0; }
    label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
    .ring { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; border: 3px solid; background: transparent; }
    .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type=search] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
    main { position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; cursor: grab; }
    svg.dragging { cursor: grabbing; }
    .node { cursor: pointer; }
    .node text { font-size: 11px; fill: var(--text); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
    .dim { opacity: .12; }
    #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
    #detail dt { color: var(--muted); }
    #detail dd { margin: 0; word-break: break-word; }
    #detail a { color: var(--resources); }
    .empty { color: var(--muted); }
    #status { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Vault graph</h1>
    <span class="stat" id="stats"></span>
    <span style="flex:1"></span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <aside>
    <h2>Search</h2>
    <input id="search" type="search" placeholder="Title or path">
    <h2>PARA bucket</h2>
    <div id="buckets"></div>
    <h2>Mastery</h2>
    <div id="mastery"></div>
  </aside>
  <main>
    <svg id="graph" role="img" aria-label="Link graph of the vault's notes"></svg>
    <div id="status"></div>
  </main>
  <aside id="detail"><p class="empty">Select a note to see its PARA location and sparring state.</p></aside>
  <script src="vault-view.js"></script>
</body>
</html>
