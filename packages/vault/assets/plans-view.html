<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plans</title>
  <style>
    :root {
      color-scheme: dark;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --bg: #070a12; --panel: rgba(14, 19, 32, .86); --panel-solid: #0e1320; --raised: rgba(255, 255, 255, .04); --raised-2: rgba(255, 255, 255, .07);
      --line: rgba(148, 163, 184, .13); --line-strong: rgba(148, 163, 184, .26);
      --text: #eef2f8; --muted: #93a0b4; --faint: #5d6a80;
      --accent: #8fa8ff; --accent-soft: rgba(143, 168, 255, .16);
      --shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
      --projects: #fb923c; --areas: #a78bfa; --archive: #64748b; --none: #cbd5e1;
      --met: #34d399; --open: #8fa8ff; --missed: #fb7185; --dropped: #64748b; --slip: #fbbf24;
      --done-rgb: 52, 211, 153; --planned: #8fa8ff;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7fb; --panel: rgba(255, 255, 255, .9); --panel-solid: #ffffff; --raised: rgba(15, 23, 42, .035); --raised-2: rgba(15, 23, 42, .06);
      --line: rgba(15, 23, 42, .1); --line-strong: rgba(15, 23, 42, .2);
      --text: #0f172a; --muted: #55627a; --faint: #8a95a8;
      --accent: #4f6ef7; --accent-soft: rgba(79, 110, 247, .12);
      --shadow: 0 18px 50px rgba(15, 23, 42, .12), 0 2px 8px rgba(15, 23, 42, .06);
      --projects: #ea580c; --areas: #7c3aed; --archive: #94a3b8; --none: #334155;
      --met: #059669; --open: #4f6ef7; --missed: #e11d48; --dropped: #94a3b8; --slip: #d97706;
      --done-rgb: 16, 185, 129; --planned: #4f6ef7;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 14px/1.45 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    button, select { font: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .01em; }
    .span { font: 600 15px/1 var(--mono); min-width: 7.5em; text-align: center; }
    .btn { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
    .btn:hover { background: var(--raised-2); }
    .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .group { display: inline-flex; gap: 4px; }
    .spacer { flex: 1; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    main { flex: 1; display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: 0; }
    main.with-panel { grid-template-columns: minmax(260px, 340px) 1fr minmax(300px, 380px); }
    section { overflow: auto; min-height: 0; }
    section + section { border-left: 1px solid var(--line); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 18px 8px; }

    .tree { list-style: none; margin: 0; padding: 0 10px 18px 18px; }
    .tree .tree { padding: 0 0 0 16px; border-left: 1px dashed var(--line-strong); margin-left: 6px; }
    .goal { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
    .goal:hover { background: var(--raised); }
    .goal.selected { background: var(--accent-soft); }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(1px); }
    .met { background: var(--met); } .open { background: var(--open); } .missed { background: var(--missed); } .dropped { background: var(--dropped); }
    .goal .text { flex: 1; }
    .owner { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
    li .owner { display: inline; margin-left: 6px; }
    .tag { font: 600 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 5px; background: var(--raised-2); color: var(--muted); white-space: nowrap; }
    .tag.slip { color: var(--slip); }
    .empty { color: var(--faint); padding: 8px 18px; }

    table { border-collapse: separate; border-spacing: 0; margin: 0 18px 18px 0; }
    th, td { padding: 0; }
    thead th { position: sticky; top: 0; z-index: 2; background: var(--bg); font: 600 11px/1 var(--mono); color: var(--muted); padding: 10px 4px 8px; cursor: pointer; white-space: nowrap; }
    thead th.current { color: var(--accent); }
    th.name { position: sticky; left: 0; z-index: 3; background: var(--bg); text-align: left; padding: 0 12px 0 18px; font: inherit; min-width: 210px; cursor: pointer; }
    thead th.name { cursor: default; }
    tr.workstream th.name { padding-left: 34px; font-size: 13px; color: var(--muted); }
    tr.project th.name { font-weight: 600; }
    tr.project th.name::before, tr.area th.name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; background: var(--projects); }
    tr.area th.name::before { background: var(--areas); border-radius: 50%; }
    tr.archived th.name { color: var(--faint); }
    tr.archived th.name::before { background: var(--archive); }
    tr.selected th.name, tr.lit th.name { color: var(--accent); }
    tr.lit td .cell { box-shadow: inset 0 0 0 1px var(--accent); }
    tr.sep th, tr.sep td { border-top: 1px solid var(--line); }
    td { padding: 3px; }
    .cell { position: relative; width: 52px; height: 30px; border-radius: 6px; background: var(--raised); cursor: pointer; display: grid; place-items: center; font: 600 11px/1 var(--mono); }
    td.current .cell { outline: 1px solid var(--line-strong); }
    .cell.planned { box-shadow: inset 0 0 0 1.5px var(--planned); background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--accent-soft) 5px 7px); }
    .cell .pin { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--bg); }
    .cell .slip { position: absolute; bottom: 1px; right: 3px; font-size: 9px; color: var(--slip); }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 0 18px 18px; color: var(--muted); font-size: 12px; }
    .legend .cell { width: 22px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 5px; cursor: default; }

    aside { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 16px 18px 24px; }
    aside h3 { margin: 0 0 4px; font-size: 16px; }
    aside .close { float: right; }
    aside ul { list-style: none; padding: 0; margin: 8px 0 16px; }
    aside li { padding: 7px 0; border-bottom: 1px solid var(--line); }
    aside li .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
    .state-done { text-decoration: line-through; color: var(--muted); }
    .links { display: flex; gap: 10px; font-size: 12px; margin-top: 3px; }
    .error { padding: 24px; color: var(--missed); }
  </style>
</head>
<body>
  <header>
    <h1>Plans</h1>
    <button class="btn" id="prev" title="Previous span (←)">‹</button>
    <span class="span" id="span"></span>
    <button class="btn" id="next" title="Next span (→)">›</button>
    <button class="btn" id="today" title="Back to today (T)">Today</button>
    <span class="group" id="zoom"></span>
    <button class="btn" id="archived" aria-pressed="false" title="Show archived projects (A)">Archived</button>
    <span class="spacer"></span>
    <a class="btn" href="/" title="The vault graph">Vault graph</a>
    <a class="btn" href="/climb" title="The learning climb of each concept note">Climb</a>
    <button class="btn" id="theme" title="Light or dark">◐</button>
  </header>
  <main id="main">
    <section>
      <h2>Goals</h2>
      <div id="goals"></div>
    </section>
    <section>
      <h2 id="timeline-title">Effort</h2>
      <div id="timeline"></div>
      <div class="legend">
        <span><span class="cell" style="background: rgba(var(--done-rgb), .55)"></span>done (size-weighted)</span>
        <span><span class="cell planned"></span>planned, open</span>
        <span><span class="dot met" style="display:inline-block"></span> met</span>
        <span><span class="dot open" style="display:inline-block"></span> open</span>
        <span><span class="dot missed" style="display:inline-block"></span> missed</span>
        <span><span class="dot dropped" style="display:inline-block"></span> dropped</span>
        <span class="tag slip">↻ slipped</span>
      </div>
    </section>
    <aside id="panel" hidden></aside>
  </main>
  <script src="plans-view.js"></script>
</body>
</html>
